[project]
name = "loop-steer"
version = "0.1.0"
description = "Activation steering experiments with ByteDance Ouro"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.12,<2",
    "einops>=0.8,<1",
    "huggingface-hub>=0.36,<1",
    "ipykernel>=6.30,<8",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "nbclient>=0.10,<1",
    "numpy>=2,<3",
    "openai>=2,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18",
    "torch==2.10.0",
    "transformers==4.57.6",
    "vllm==0.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "only-managed"
